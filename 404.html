<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Diken Bros</title>
<meta name="description" content="The page you asked for is not on the Diken Bros site. Go back to the home page in English or Arabic.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Self-contained: this page is served for any missing path, on the custom domain and on the GitHub Pages preview alike. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0b0b0c; color: #f4f4f2; font-family: "Alexandria", "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 24px; }
  .box { max-width: 640px; }
  .mark { width: 56px; height: 56px; border-radius: 6px; margin: 0 auto 28px; display: block; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: 0.25em; color: #ed1c26; margin-bottom: 14px; }
  h1 { margin: 0; font-size: clamp(32px, 5vw, 56px); font-weight: 800; letter-spacing: -0.015em; line-height: 1.08; }
  p { margin: 18px auto 0; font-size: 18px; line-height: 1.6; color: rgba(244,244,242,0.72); max-width: 44ch; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 24px; border-radius: 6px; font-weight: 600; text-decoration: none; color: #fff; background: #d4141d; }
  a.btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.24); color: #f4f4f2; }
</style>
</head>
<body>
<main class="box">
  <img class="mark" data-asset="assets/brand/diken-d-512.png" alt="" width="56" height="56">
  <div class="tag">404</div>
  <h1>This page is not here.</h1>
  <p>The link may be old or mistyped. Everything Diken does is one click from the home page.</p>
  <p dir="rtl" lang="ar">هذه الصفحة غير موجودة. عُد إلى الصفحة الرئيسية.</p>
  <div class="actions">
    <a class="btn" data-page="index.html" href="/">Home</a>
    <a class="btn ghost" data-page="ar/index.html" href="/ar/" lang="ar">الصفحة الرئيسية</a>
  </div>
</main>
<script>
  // The site root is "/" on dikendelivery.com and "/<repo>/" on a GitHub Pages project preview.
  (function () {
    var root = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
    document.querySelectorAll('[data-page]').forEach(function (a) { a.href = root + a.getAttribute('data-page'); });
    document.querySelectorAll('[data-asset]').forEach(function (i) { i.src = root + i.getAttribute('data-asset'); });
  })();
</script>
</body>
</html>
